<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyPatientHUB - Login</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<main class="login-page">

  <div class="login-image"></div>

  <section class="login">

    <h1>Welcome to MyPatientHUB!</h1>
    <p>We provide smart healthcare services in your hands.</p>

    <form>

      <h2>Sign in to MyPatientHUB</h2>

      <div class="social">

        <button type="button">
          <i class="fa-brands fa-facebook-f"></i>
        </button>

        <button type="button">
          <i class="fa-brands fa-google"></i>
        </button>

      </div>

      <input type="email" placeholder="Email">

      <input type="password" placeholder="Please enter your password">

      <button class="signin" type="submit">SIGN IN</button>

      <div class="options">

        <a href="#">Forgot password?</a>

        <label>
          <input type="checkbox">
          Remember me
        </label>

      </div>

      <div class="or">or</div>

      <button class="signup" type="button">SIGN UP</button>

    </form>

  </section>

  <footer>

    <a href="#">Google Play Store APP</a>
    <a href="#">App Store APP</a>
    <a href="#">About MyPatientHUB</a>
    <a href="#">About Us</a>
    <a href="#">Our Blog</a>

  </footer>

</main>

<!-- JavaScript -->
<script src="script.js"></script>

</body>
</html>
